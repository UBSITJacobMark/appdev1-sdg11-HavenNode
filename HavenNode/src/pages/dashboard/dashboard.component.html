<div class="container-fluid py-3 dashboard-layout">
  <div class="row h-100 g-3">
    
    <div class="col-md-4 col-lg-3 d-flex flex-column gap-3 overflow-auto sidebar-scroll">
      
      @if (facade.isLoading()) {
        <div class="alert alert-info text-center">
          <div class="spinner-border spinner-border-sm me-2" role="status"></div>
          Fetching Open-Meteo Data...
        </div>
      }

      @if (facade.hazardState(); as data) {
        <div class="card shadow-sm" [ngClass]="facade.riskColorClass()">
          <div class="card-body text-center py-4">
            <h6 class="text-uppercase fw-bold opacity-75 mb-1">Status</h6>
            <h3 class="fw-bold mb-0">{{ facade.riskLevel() }} RISK</h3>
            <small class="opacity-75">La Trinidad Basin</small>
          </div>
        </div>

        <div class="card border-primary shadow-sm">
          <div class="card-header bg-primary text-white fw-bold">PAGASA Bulletin</div>
          <div class="card-body">
            <h5 class="mb-0">{{ data.pagasaSignal }}</h5>
          </div>
        </div>

        <div class="card border-dark shadow-sm mt-auto">
          <div class="card-header bg-dark text-white fw-bold">Map Controls</div>
          <div class="card-body">
            <div class="form-check form-switch">
              <input class="form-check-input" type="checkbox" role="switch" id="hazardToggle" checked (change)="onToggleHazardMap()">
              <label class="form-check-label" for="hazardToggle">Show 25-yr Flood Zones</label>
            </div>
          </div>
        </div>
      }
    </div>

    <div class="col-md-8 col-lg-9 h-100">
      <div class="card shadow-sm h-100 border-0 rounded-3 p-1 bg-white">
        
        <app-map #hazardMap 
          [center]="[120.5828, 16.4550]" 
          [zoom]="13.5">
        </app-map>
        
      </div>
    </div>
    
  </div>
</div>
