<div class="container-fluid dashboard-layout">
  <div class="row h-100 g-3 py-3">
    
    <!-- Sidebar -->
    <div class="col-md-3 d-flex flex-column gap-3 sidebar-scroll">
      @if (facade.hazardState(); as data) {
        <div class="card shadow-sm" [ngClass]="facade.riskColorClass()">
          <div class="card-body text-center py-4">
            <h6 class="text-uppercase fw-bold opacity-75 mb-1">Benguet Risk Status</h6>
            <h3 class="fw-bold mb-0">{{ facade.riskLevel() }}</h3>
          </div>
        </div>

        <!-- Layer Controls -->
        <div class="card border-dark shadow-sm mt-auto">
          <div class="card-header bg-dark text-white fw-bold small">Map Control Center</div>
          <div class="card-body">
            <!-- Flood Toggle -->
            <div class="form-check form-switch mb-2">
              <input class="form-check-input" type="checkbox" role="switch" id="floodToggle" checked 
                     (change)="onToggleLayer('flood-inundation-layer')">
              <label class="form-check-label small" for="floodToggle">Hazard Zones (Project NOAH)</label>
            </div>
            
            <!-- Weather Toggle -->
            <div class="form-check form-switch">
              <input class="form-check-input" type="checkbox" role="switch" id="weatherToggle" 
                     (change)="onToggleLayer('weather-radar-layer')">
              <label class="form-check-label small" for="weatherToggle">Live Weather Radar</label>
            </div>
          </div>
        </div>
      }
    </div>

    <!-- Map Area -->
    <div class="col-md-9 h-100">
      <div class="card h-100 shadow-sm border-0 overflow-hidden">
        <app-map #hazardMap></app-map>
      </div>
    </div>
    
  </div>
</div>
