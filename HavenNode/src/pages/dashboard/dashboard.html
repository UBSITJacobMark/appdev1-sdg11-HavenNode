<main class="container mt-4">
    <header class="mb-4">
      <h1 class="text-primary">Benguet Disaster Monitor: {{ currentCity() }}</h1>
      <p class="lead">Real-time hazard data for SDG 11 compliance.</p>
    </header>
  
    <div class="row" *ngIf="sensors$ | async as sensors; else loading">
      <div class="col-md-4" *ngFor="let sensor of sensors">
        <div class="card border-info mb-3">
          <div class="card-header">{{ sensor.type }}</div>
          <div class="card-body">
            <h4 class="card-title">{{ sensor.location }}</h4>
            <p class="card-text">Current Value: <strong>{{ sensor.value }}</strong></p>
            <p class="text-muted">Last Updated: {{ sensor.last_update | date:'short' }}</p>
          </div>
        </div>
      </div>
    </div>
  
    <ng-template #loading>
      <div class="text-center mt-5">
        <div class="spinner-border text-info" role="status"></div>
        <p>Fetching Benguet sensor data...</p>
      </div>
    </ng-template>
  </main>
