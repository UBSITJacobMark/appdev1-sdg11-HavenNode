<div class="contact-wrapper">

  <div class="contact-card">

    <div class="contact-header">
      <div class="logo-badge">HN</div>
      <h1>Contact Us</h1>
      <p>Have a question or concern about hazard data in Benguet? Reach out to the HavenNode team.</p>
    </div>

    <form class="contact-form" (ngSubmit)="onSubmit()">

      <div class="form-row">
        <div class="form-group">
          <label for="name">Full Name</label>
          <input
            type="text"
            id="name"
            [(ngModel)]="name"
            name="name"
            placeholder="Juan dela Cruz"
            required
          />
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input
            type="email"
            id="email"
            [(ngModel)]="email"
            name="email"
            placeholder="you@example.com"
            required
          />
        </div>
      </div>

      <div class="form-group">
        <label for="subject">Subject</label>
        <input
          type="text"
          id="subject"
          [(ngModel)]="subject"
          name="subject"
          placeholder="e.g. Hazard report, Data correction, General inquiry"
          required
        />
      </div>

      <div class="form-group">
        <label for="message">Message</label>
        <textarea
          id="message"
          [(ngModel)]="message"
          name="message"
          rows="5"
          placeholder="Describe your concern or inquiry here..."
          required
        ></textarea>
      </div>

      <button type="submit" class="submit-btn">Send Message</button>

    </form>

    <div class="divider"></div>

    <div class="alt-contact">
      <div class="alt-item">
        <span class="alt-icon">📧</span>
        <div>
          <strong>Email</strong>
          <p>contact@havennode.ph</p>
        </div>
      </div>
      <div class="alt-item">
        <span class="alt-icon">🏛</span>
        <div>
          <strong>Office</strong>
          <p>CDRRMO Benguet, La Trinidad, Benguet</p>
        </div>
      </div>
      <div class="alt-item">
        <span class="alt-icon">🚨</span>
        <div>
          <strong>Emergency Hotline</strong>
          <p>911 or local barangay DRRM officer</p>
        </div>
      </div>
    </div>

  </div>

  <p class="back-link">
    <a routerLink="/about">← Back to About</a>
  </p>

</div>
