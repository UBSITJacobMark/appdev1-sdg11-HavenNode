<div class="register-wrapper">

    <div class="register-card">
  
      <div class="register-header">
        <div class="logo-badge">HN</div>
        <h1>Create Account</h1>
        <p>Join HavenNode to access Benguet's hazard map</p>
      </div>
  
      <form class="register-form" (ngSubmit)="onRegister()">
  
        <div class="form-group">
          <label for="name">Full Name</label>
          <input
            type="text"
            id="name"
            [(ngModel)]="name"
            name="name"
            placeholder="Juan dela Cruz"
            required
          />
        </div>
  
        <div class="form-group">
          <label for="email">Email</label>
          <input
            type="email"
            id="email"
            [(ngModel)]="email"
            name="email"
            placeholder="you@example.com"
            required
          />
        </div>
  
        <div class="form-group">
          <label for="municipality">Municipality / Location</label>
          <select
            id="municipality"
            [(ngModel)]="municipality"
            name="municipality"
            required
          >
            <option value="" disabled selected>Select your municipality</option>
            <option *ngFor="let m of municipalities" [value]="m">{{ m }}</option>
          </select>
        </div>
  
        <div class="form-group">
          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            [(ngModel)]="password"
            name="password"
            placeholder="••••••••"
            required
          />
        </div>
  
        <div class="form-group">
          <label for="confirmPassword">Confirm Password</label>
          <input
            type="password"
            id="confirmPassword"
            [(ngModel)]="confirmPassword"
            name="confirmPassword"
            placeholder="••••••••"
            required
          />
        </div>
  
        <button type="submit" class="register-btn">Create Account</button>
  
      </form>
  
      <div class="register-footer">
        <span>Already have an account?</span>
        <a routerLink="/login">Sign In</a>
      </div>
  
    </div>
  
    <p class="back-link">
      <a routerLink="/">← Back to Home</a>
    </p>
  
  </div>
